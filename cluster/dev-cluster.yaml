apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: dev-cluster
  region: us-east-1
  version: "1.32"

# No custom vpc block — eksctl auto-creates a VPC with public/private subnets
nodeGroups:
  - name: ng-1
    instanceType: t2.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
